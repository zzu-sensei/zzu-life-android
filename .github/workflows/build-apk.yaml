name: Build APK

# 触发方式：
#   1. 推送形如 v3.5.8 的标签 —— 自动构建并发布 Release（附带 APK 供下载）
#   2. 手动触发 —— 填一个标签名即可发布，留空则只上传构建产物
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "发布用的标签名（例如 v3.5.8）。留空则只构建、不发 Release"
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Chaquopy 要求 Python 3.12，而 ubuntu-latest 默认是 3.13，
      # 因此必须显式安装并把实际路径交给 CHAQUOPY_BUILD_PYTHON。
      - name: Set up Python 3.12
        id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.5"
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: flutter-app
        run: flutter pub get

      - name: Analyze
        working-directory: flutter-app
        run: flutter analyze --no-pub

      # 签名密钥通过仓库 Secrets 提供；未配置时 Gradle 会自动退回 debug 签名，
      # 构建仍然可用（但无法覆盖安装用其他密钥签名的正式版）。
      # 注意：secrets 上下文不能出现在 step 的 if 里，因此在这里自己判断。
      - name: Prepare signing key
        working-directory: flutter-app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "未配置 ANDROID_KEYSTORE_BASE64，将使用 debug 签名。"
            exit 0
          fi
          # 从终端或编辑器复制 3500 字符的长串时极易带进换行、回车或空格，
          # 而 GNU base64 -d 遇到它们会直接报 "invalid input"。这里先剔除所有
          # 空白字符再解码，避免因为一次粘贴失误就让整个发布失败。
          cleaned="$(printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]')"
          if ! printf '%s' "$cleaned" | base64 -d > zzu-life.keystore 2>/dev/null; then
            echo "::error::ANDROID_KEYSTORE_BASE64 不是合法的 Base64。"
            echo "原始长度 ${#KEYSTORE_BASE64}，剔除空白后 ${#cleaned}。"
            echo "请在仓库 Secrets 里重新粘贴：用 [Convert]::ToBase64String(...) 生成后，"
            echo "从单行文件里整段复制，确保没有换行。"
            exit 1
          fi
          if [ ! -s zzu-life.keystore ]; then
            echo "::error::解码后的密钥库为空。"
            exit 1
          fi
          # 明文比对容易出错，这里只回显长度，便于确认四个 Secret 都已填写。
          echo "密钥库已还原：$(wc -c < zzu-life.keystore) 字节"
          echo "口令长度 ${#STORE_PASSWORD} / 别名长度 ${#KEY_ALIAS} / 密钥口令长度 ${#KEY_PASSWORD}"
          {
            echo "storeFile=$PWD/zzu-life.keystore"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          echo "已写入签名配置。"

      - name: Build release APK
        working-directory: flutter-app
        env:
          CHAQUOPY_BUILD_PYTHON: ${{ steps.python.outputs.python-path }}
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename APK
        id: apk
        run: |
          version="$(grep -m1 '^version:' flutter-app/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)"
          target="release/ZZU-Life-Flutter-${version}-arm64.apk"
          mkdir -p release
          cp flutter-app/build/app/outputs/flutter-apk/app-release.apk "$target"
          echo "path=$target" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$target")" >> "$GITHUB_OUTPUT"
          ls -lh "$target"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          compression-level: 0

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
