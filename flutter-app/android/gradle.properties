# 堆上限按可用磁盘/内存收紧：8G 的堆在磁盘吃紧时容易触发反复 GC 甚至换页，
# 反而让构建卡住。3G 对 Chaquopy + AGP 的 release 构建已经足够。
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 构建行为：复用 daemon、并行、复用任务输出缓存。Chaquopy 的 Python 打包很重，
# 缓存命中与否直接决定构建是几分钟还是几十分钟。
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# 依赖下载失败多半是一次网络抖动（本机遇到过 SocketException），让它多重试几次，
# 并把超时放宽，避免整个构建因为一次丢包而从零重来。
systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=500

